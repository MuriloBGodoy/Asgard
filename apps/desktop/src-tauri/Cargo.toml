[package]
name = "asgard-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# O sufixo _lib evita conflito de nome com o binário no Windows.
name = "asgard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.1", features = [] }
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
