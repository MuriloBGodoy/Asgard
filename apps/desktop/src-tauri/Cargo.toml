[package]
name = "asgard-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# O sufixo _lib evita conflito de nome com o binário no Windows.
name = "asgard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = "2.12.1"

[build-dependencies]
tauri-build = "2.7.1"
