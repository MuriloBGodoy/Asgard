<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Asgard Metaverso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&display=swap">
<style>
/* Layout: janela do app Asgard (realms 72 | canais 240 | metaverso 1fr). Tema escuro único, como o app. */
:root {
  --bg-0: #0d1017;
  --bg-1: #141823;
  --bg-2: #1b2130;
  --bg-3: #252d40;
  --frame: #07090d;
  --text: #e6e9f0;
  --text-muted: #8a93a8;
  --gold: #e3b341;
  --on-gold: #1a1400;
  --gaming: #7c5cff;
  --gaming-text: #a48bff;
  --work: #2bb39a;
  --danger: #ef5b5b;
  --danger-text: #ff8a8a;
  --glass: rgba(13, 16, 23, 0.92);
  --radius: 10px;
  --font-ui: "Segoe UI", Inter, system-ui, sans-serif;
  --font-pixel: "Pixelify Sans", "Segoe UI", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--frame);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  padding-inline: 16px;
  padding-block: 16px;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 72px 240px minmax(0, 1fr);
  border: 1px solid var(--bg-3);
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  background: var(--bg-0);
}
.nav { display: contents; }

/* ---------- Realm bar ---------- */
.realm-bar { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; background: var(--bg-0); }
.realm-icon {
  width: 48px; height: 48px; border: none; border-radius: 50%;
  background: var(--bg-2); font-weight: 700; transition: border-radius .15s, background .15s;
}
.realm-icon:hover, .realm-icon.active { border-radius: 14px; }
.realm-icon.gaming.active { background: var(--gaming); }
.realm-icon.work.active { background: var(--work); color: #06221d; }
.realm-sep { width: 32px; height: 2px; background: var(--bg-3); border-radius: 2px; }

/* ---------- Lista de canais ---------- */
.channel-list { display: flex; flex-direction: column; background: var(--bg-1); min-height: 0; min-width: 0; }
.channel-list > header { padding: 14px 16px; font-weight: 600; border-bottom: 1px solid var(--bg-0); display: flex; justify-content: space-between; align-items: center; }
.channels { flex: 1; overflow-y: auto; padding: 8px; }
.channels h3 { margin: 14px 8px 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 600; }
.ch {
  display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 10px; border: none; border-radius: 6px;
  background: none; text-align: left; color: var(--text-muted);
}
.ch:hover, .ch.active { background: var(--bg-3); color: var(--text); }
.ch .count { margin-left: auto; font-size: .72rem; color: var(--text-muted); }
.ch.active .count { color: var(--text); }
.ch.meta-entry.active { box-shadow: inset 2px 0 0 var(--gold); }
.ch.voice-on { color: var(--text); background: rgba(43, 179, 154, .14); box-shadow: inset 2px 0 0 var(--work); }
.ch.voice-on .count { color: var(--work); }
.parts { list-style: none; margin: 2px 0 6px; padding: 0 0 0 26px; display: flex; flex-direction: column; gap: 2px; }
.parts li { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text-muted); padding: 2px 4px; }
.parts li.speaking { color: var(--text); }
.parts li.empty { font-style: italic; font-size: .8rem; }
.mini-av {
  width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  font-size: .65rem; font-weight: 700; color: #0d1017; flex: none; box-shadow: 0 0 0 2px var(--bg-1);
}
.speaking .mini-av { box-shadow: 0 0 0 2px var(--gold); }
.parts .tag { margin-left: auto; font-size: .7rem; }
.other-realm { font-size: .7rem; color: var(--gaming-text); margin-left: auto; }
.other-realm.work { color: var(--work); }

.voice-status {
  margin: 0 8px 8px; padding: 10px 12px; border-radius: 8px; background: var(--bg-0);
  display: flex; align-items: center; gap: 10px; font-size: .85rem;
}
.voice-status strong { color: var(--work); display: block; font-size: .8rem; }
.voice-status.connecting strong { color: var(--gold); }
.voice-status.error strong { color: var(--danger-text); }
.voice-status small { color: var(--text-muted); }
.voice-status .grow { flex: 1; min-width: 0; }
.icon-btn {
  width: 32px; height: 32px; display: grid; place-items: center; border: none; border-radius: 8px;
  background: var(--bg-2); color: var(--text);
}
.icon-btn:hover { background: var(--bg-3); }
.icon-btn svg { width: 18px; height: 18px; }
.channel-list footer { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg-0); }
.channel-list footer div { display: flex; flex-direction: column; }
.channel-list footer small { color: var(--text-muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--work); flex: none; }
.dot.focus { background: var(--gold); }
.dot.away { background: var(--text-muted); }

/* ---------- Área do metaverso ---------- */
.meta { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-2); }
.meta-head {
  display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 16px; min-height: 52px;
  border-bottom: 1px solid var(--bg-0); flex-wrap: wrap;
}
.meta-head h1 { margin: 0; font-size: 1rem; font-weight: 600; }
.meta-head .sub { color: var(--text-muted); font-size: .85rem; }
.meta-head .spacer { flex: 1; }
.menu-btn { display: none; }
.seg { display: inline-flex; padding: 3px; background: var(--bg-0); border-radius: 8px; gap: 2px; }
.seg button { border: none; background: none; padding: 5px 10px; border-radius: 6px; font-size: .8rem; color: var(--text-muted); }
.seg button[aria-pressed="true"] { background: var(--bg-3); color: var(--text); }
.sim { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-muted); }
.sim select { background: var(--bg-0); border: 1px solid var(--bg-3); border-radius: 6px; padding: 4px 6px; font-size: .8rem; }

.stage { position: relative; flex: 1; min-height: 0; background: #06080c; overflow: hidden; --panel-w: 316px; --mm-w: 184px; --mid: calc(var(--mm-w) + (100% - var(--panel-w) - var(--mm-w)) / 2); }
.stage.panel-hidden { --panel-w: 0px; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
.glass { background: var(--glass); border: 1px solid var(--bg-3); border-radius: var(--radius); backdrop-filter: blur(6px); }

.loc {
  position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 10px; border-radius: 999px; font-size: .85rem; max-width: calc(100% - var(--panel-w) - 36px);
}
.loc b { font-weight: 600; }
.loc .muted { color: var(--text-muted); }
.loc.voice { border-color: var(--work); }
.loc.voice b { color: var(--work); }
.loc.connecting { border-color: var(--gold); }
.loc.error { border-color: var(--danger); }
.loc.error b { color: var(--danger-text); }

.toast {
  position: absolute; bottom: 84px; left: var(--mid); transform: translateX(-50%);
  padding: 8px 14px; font-size: .85rem; max-width: min(440px, calc(100% - 32px)); text-align: center;
  transition: opacity .2s;
}
.hint {
  position: absolute; top: 56px; left: calc((100% - var(--panel-w)) / 2); transform: translateX(-50%);
  padding: 6px 8px 6px 14px; display: flex; gap: 14px; align-items: center; font-size: .82rem; width: max-content; max-width: calc(100% - var(--panel-w) - 32px);
  flex-wrap: wrap;
}
kbd {
  display: inline-block; min-width: 22px; padding: 1px 6px; border-radius: 5px; background: var(--bg-3);
  border-bottom: 2px solid var(--bg-0); font-family: var(--font-ui); font-size: .78rem; text-align: center; color: var(--text);
}
.hint button { border: none; background: var(--bg-3); border-radius: 6px; padding: 4px 10px; font-size: .8rem; }

.prompt {
  position: absolute; left: 0; top: 0; padding: 5px 10px; font-size: .8rem; display: flex; gap: 6px; align-items: center;
  border-color: var(--gold); white-space: nowrap; pointer-events: auto;
}

/* Painel lateral: conversa por proximidade / sala de voz */
.panel {
  position: absolute; top: 12px; right: 12px; bottom: 84px; width: 292px;
  display: flex; flex-direction: column; overflow: hidden;
}
.panel.compact { bottom: auto; max-height: calc(100% - 96px); }
.panel header { padding: 12px 14px 10px; border-bottom: 1px solid var(--bg-3); display: flex; gap: 8px; align-items: flex-start; }
.panel header .grow { flex: 1; min-width: 0; }
.panel h2 { margin: 0; font-size: .95rem; font-weight: 600; }
.panel header p { margin: 2px 0 0; font-size: .78rem; color: var(--text-muted); }
.panel .body { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.panel .close { width: 28px; height: 28px; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; background: var(--bg-2); font-size: .8rem; }
.chip.speaking { box-shadow: 0 0 0 1.5px var(--gold); }
.msgs { display: flex; flex-direction: column; gap: 8px; }
.msg .meta-line { display: flex; gap: 6px; align-items: baseline; font-size: .8rem; }
.msg .meta-line strong { font-size: .85rem; }
.msg time { color: var(--text-muted); font-size: .72rem; }
.msg p { margin: 1px 0 0; font-size: .88rem; overflow-wrap: anywhere; }
.sys { font-size: .78rem; color: var(--text-muted); text-align: center; padding: 4px 0; }
.composer { padding: 10px 14px 12px; border-top: 1px solid var(--bg-3); }
.composer input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid transparent; background: var(--bg-3); outline: none; font-size: .88rem; }
.composer input:focus { border-color: var(--gold); }
.note { font-size: .75rem; color: var(--text-muted); margin: 6px 0 0; }
.btn { border: none; border-radius: 8px; padding: 7px 12px; font-size: .82rem; font-weight: 600; background: var(--bg-3); }
.btn:hover { filter: brightness(1.15); }
.btn.primary { background: var(--gold); color: var(--on-gold); }
.btn.work { background: var(--work); color: #06221d; }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.plist li { display: flex; align-items: center; gap: 10px; padding: 6px 6px; border-radius: 6px; font-size: .88rem; }
.plist li .where { margin-left: auto; font-size: .75rem; color: var(--text-muted); text-align: right; }
.plist li.speaking { background: rgba(227, 179, 65, .08); }
.plist button.row { all: unset; display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer; padding: 6px; border-radius: 6px; font-size: .88rem; box-sizing: border-box; }
.plist button.row:hover, .plist button.row:focus-visible { background: var(--bg-2); }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.bars i { width: 3px; background: var(--gold); border-radius: 1px; height: 4px; }
.speaking .bars i:nth-child(1) { height: 8px; } .speaking .bars i:nth-child(2) { height: 12px; } .speaking .bars i:nth-child(3) { height: 6px; }
.card { background: var(--bg-2); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; font-size: .85rem; }
.card .grow { flex: 1; min-width: 0; }
.card small { display: block; color: var(--text-muted); font-size: .75rem; }
.cam-tile { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 8px; display: grid; place-items: center; font-size: 1.6rem; font-weight: 700; color: #0d1017; position: relative; }
.cam-tile span { position: absolute; left: 8px; bottom: 6px; font-size: .7rem; font-weight: 600; background: var(--glass); color: var(--text); padding: 2px 6px; border-radius: 4px; }
.reopen { position: absolute; top: 12px; right: 12px; padding: 7px 12px; font-size: .82rem; display: flex; gap: 6px; align-items: center; }

/* Minimapa */
.minimap { position: absolute; left: 12px; bottom: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.minimap .mm-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-pixel); font-size: .8rem; color: var(--text-muted); }
.minimap canvas { width: 156px; height: 102px; image-rendering: pixelated; border-radius: 4px; cursor: pointer; display: block; }
.zoom { display: flex; gap: 4px; }
.zoom button { width: 24px; height: 24px; border: none; border-radius: 6px; background: var(--bg-3); font-weight: 700; line-height: 1; }

/* Barra de controles */
.controls {
  position: absolute; bottom: 12px; left: var(--mid); transform: translateX(-50%);
  display: flex; gap: 6px; padding: 6px; border-radius: 14px;
}
.ctl {
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 66px; padding: 7px 8px 6px;
  border: none; border-radius: 10px; background: var(--bg-2); font-size: .7rem; color: var(--text);
}
.ctl svg { width: 20px; height: 20px; }
.ctl:hover { background: var(--bg-3); }
.ctl.off { background: rgba(239, 91, 91, .16); color: var(--danger-text); }
.ctl.on { background: var(--gold); color: var(--on-gold); }
.ctl.leave { background: var(--danger); color: #1a0505; }
.ctl:disabled { opacity: .4; cursor: not-allowed; background: var(--bg-2); color: var(--text); }
.ctl-sep { width: 1px; background: var(--bg-3); margin: 4px 2px; }

/* Modais */
.modal-back { position: absolute; inset: 0; background: rgba(5, 7, 10, .62); display: grid; place-items: center; padding: 16px; z-index: 5; }
.modal { width: min(520px, 100%); max-height: 100%; overflow: auto; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal.wide { width: min(760px, 100%); }
.modal header { display: flex; align-items: flex-start; gap: 12px; }
.modal header .grow { flex: 1; min-width: 0; }
.modal h2 { margin: 0; font-size: 1.1rem; text-wrap: balance; }
.modal header p { margin: 4px 0 0; color: var(--text-muted); font-size: .85rem; }
.events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.events li { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--bg-2); border-radius: 8px; padding: 10px 12px; }
.when { font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--gold); font-weight: 600; line-height: 1.3; }
.events .where { font-size: .78rem; color: var(--text-muted); }
.events .tag { font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--bg-3); white-space: nowrap; }
.events .tag.work { color: var(--work); } .events .tag.gaming { color: var(--gaming-text); } .events .tag.pause { color: var(--gold); }
form.add { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) minmax(0, 1.2fr) auto; gap: 8px; align-items: end; }
form.add label { display: flex; flex-direction: column; gap: 4px; font-size: .75rem; color: var(--text-muted); }
form.add input, form.add select { padding: 7px 9px; border-radius: 7px; border: 1px solid var(--bg-3); background: var(--bg-0); font-size: .85rem; min-width: 0; }
.radio-list { display: flex; flex-direction: column; gap: 6px; }
.radio-list label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--bg-2); border-radius: 8px; font-size: .88rem; cursor: pointer; }
.radio-list small { display: block; color: var(--text-muted); font-size: .78rem; }
.toggle-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--bg-2); border-radius: 8px; font-size: .88rem; }
.toggle-row .grow { flex: 1; }
.toggle-row small { display: block; color: var(--text-muted); font-size: .78rem; }
.quiz-q { font-size: 1.05rem; font-weight: 600; }
.quiz-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.quiz-opts button { padding: 12px; border-radius: 8px; border: 1px solid var(--bg-3); background: var(--bg-2); font-weight: 600; }
.quiz-opts button.right { border-color: var(--work); color: var(--work); }
.quiz-opts button.wrong { border-color: var(--danger); color: var(--danger-text); }
.score { display: flex; gap: 8px; flex-wrap: wrap; font-size: .82rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* Tela compartilhada (fictícia) */
.shared { background: #0f131c; border-radius: 8px; border: 1px solid var(--bg-3); overflow: hidden; }
.shared .bar { display: flex; gap: 6px; padding: 8px 10px; background: var(--bg-1); font-size: .75rem; color: var(--text-muted); align-items: center; }
.shared .bar i { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-3); }
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px; }
.kanban h4 { margin: 0 0 8px; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.kanban .k { background: var(--bg-2); border-radius: 6px; padding: 8px; font-size: .8rem; margin-bottom: 6px; border-left: 3px solid var(--work); }
.kanban .k.g { border-left-color: var(--gaming); } .kanban .k.y { border-left-color: var(--gold); }

/* Stub de canal de texto */
.text-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.text-view .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.text-view .banner { margin: 12px 16px 0; padding: 10px 12px; border-radius: 8px; background: rgba(43, 179, 154, .12); font-size: .85rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Telas menores ---------- */
@media (max-width: 1100px) {
  .app { grid-template-columns: 72px minmax(0, 1fr); }
  .channel-list { position: absolute; left: 72px; top: 0; bottom: 0; width: 240px; z-index: 8; box-shadow: 8px 0 24px rgba(0,0,0,.5); }
  .app:not(.drawer-open) .channel-list { display: none; }
  .menu-btn { display: grid; }
}
@media (max-width: 700px) {
  body { padding-inline: 8px; padding-block: 8px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .realm-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 72px; z-index: 8; }
  .app:not(.drawer-open) .realm-bar { display: none; }
  .meta { grid-column: 1; }
  .sim span { display: none; }
  .minimap { display: none; }
  .stage { --panel-w: 0px; --mm-w: 0px; }
  .sim select { max-width: 112px; }
  .seg button { padding: 5px 8px; }
  .panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 74px; max-height: 46%; }
  .panel.compact { bottom: 74px; }
  .loc { max-width: calc(100% - 24px); }
  .ctl { min-width: 46px; padding: 8px; }
  .ctl .lbl { display: none; }
  .toast { bottom: auto; top: 56px; }
  .reopen { top: auto; bottom: 74px; }
  form.add { grid-template-columns: 1fr 1fr; }
  .events li { grid-template-columns: 64px minmax(0, 1fr); }
  .events li .tag { grid-column: 2; justify-self: start; }
  .kanban { grid-template-columns: 1fr; }
  .quiz-opts { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="app" id="app">
  <div class="nav">
    <nav class="realm-bar" aria-label="Realms" id="realm-bar"></nav>
    <aside class="channel-list" id="channel-list" aria-label="Canais"></aside>
  </div>

  <main class="meta" id="meta">
    <div class="meta-head">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Abrir canais" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h1 id="view-title">🗺️ Metaverso</h1>
        <div class="sub" id="view-sub">Asgard HQ · 10 pessoas no mapa</div>
      </div>
      <div class="spacer"></div>
      <div class="seg" role="group" aria-label="Direção visual" id="dir-seg">
        <button type="button" data-dir="noite" aria-pressed="true">Noturno Asgard</button>
        <button type="button" data-dir="cozy" aria-pressed="false">Aconchegante</button>
      </div>
      <label class="sim"><span>Estado do mockup</span>
        <select id="sim-state">
          <option value="normal">Normal</option>
          <option value="offline">Voz indisponível</option>
          <option value="alone">Só você no mapa</option>
        </select>
      </label>
    </div>

    <div class="stage" id="stage">
      <canvas id="map" tabindex="0" aria-label="Mapa do metaverso. Use WASD ou as setas para andar, E para interagir, ou clique para ir até um ponto."></canvas>
      <div class="loc glass" id="loc" aria-live="polite"></div>
      <div class="toast glass" id="toast" hidden role="status"></div>
      <div class="hint glass" id="hint">

function buildSprite(look, dir, frame, sit) {
  const key = `${look.key}|${dir}|${frame}|${sit}`;
  if (spriteCache.has(key)) return spriteCache.get(key);

  let rows = BASE[baseDir].map((s) => s.split(""));

    if (baseDir === "left") rows[6] = "..obbbssso..".split("");
  }
  if (look.long) {
    for (let i = 5; i <= 8; i++) {
      if (baseDir !== "left") { rows[i][1] = "h"; rows[i][10] = "h"; rows[i][0] = "o"; rows[i][11] = "o"; }
      else { rows[i][8] = "h"; rows[i][9] = "h"; rows[i][10] = "o"; }
    }
  }
  if (look.horns) { rows[0][2] = "g"; rows[0][9] = "g"; rows[1][1] = "g"; rows[1][10] = "g"; }
  if (dir === "right") rows = rows.map((rw) => rw.slice().reverse());
  if (look.patch && dir === "down") { rows[4][7] = "x"; rows[3][8] = "x"; rows[3][6] = "x"; }
  if (look.patch && dir === "right") { rows[4][10] = "x"; }
  const pal = { o: "#141018", h: look.hair, s: look.skin, e: "#141018", c: look.shirt, p: look.pants, b: look.beard || look.hair, x: "#050505", g: "#e3b341" };

  const c = cv.getContext("2d");
  for (let y = 0; y < n; y++) for (let x = 0; x < 12; x++) { const ch = rows[y][x]; if (ch !== "." && pal[ch]) { c.fillStyle = pal[ch]; c.fillRect(x, y, 1, 1); } }

  c.globalCompositeOperation = "source-atop"; c.fillStyle = "rgba(0,0,0,.18)"; c.fillRect(0, 10, 12, 1); c.globalCompositeOperation = "source-over";

const SPEED = 74;

function update(dt) {

  if (!dx && !dy && path && path.length) {

    else { dx = ddx / dist; dy = ddy / dist; }

  const moving = !!(dx || dy);
  if (moving) {

    const sx = dx * SPEED * dt, sy = dy * SPEED * dt;
    if (!blocked(me.x + sx, me.y)) me.x += sx;
    if (!blocked(me.x, me.y + sy)) me.y += sy;

  if (reduce) { camX = tx; camY = ty; } else { const k = Math.min(1, dt * 7); camX += (tx - camX) * k; camY += (ty - camY) * k; }

  // sala atual
  const rm = roomAt(me.x, me.y - 2);
  const rid = rm ? rm.id : null;
  if (rid !== (state.room && state.room.id)) onRoomChange(rm);
  // proximidade (fora de salas de voz)
  const R = 3.2 * T;
  const inVoice = rm && rm.kind === "voice";
  const near = inVoice ? [] : visibleNpcs().filter((n) => !(n.room && n.room.kind === "voice") && Math.hypot(n.x - me.x, n.y - me.y) < R).map((n) => n.id);
  if (near.join() !== state.near.join()) { state.near = near; renderPanel(); }
  // interação
  const it = findInteract();
  if ((it && it.id) !== (state.interact && state.interact.id)) { state.interact = it; renderPrompt(); }
}

  let html = `<button class="ch ${on ? "voice-on" : ""}" data-voice="${id}" title="Ir até a sala ${rm.name} no mapa">🔊 ${rm.name}${otherRealm ? realmTag : `<span class="count">${status}</span>`}</button>`;

}

/* ---------- Painel ---------- */
const panel = $("#panel");
function threadKey() { return state.near.slice().sort().join("+"); }
function renderPanel() {
  if (state.panelHidden) { panel.hidden = true; $("#reopen").hidden = false; stage.classList.add("panel-hidden"); return; }
  panel.hidden = false; $("#reopen").hidden = true; stage.classList.remove("panel-hidden");
  const rm = state.room, vs = state.voice;
  const head = (title, sub) => `<header><div class="grow"><h2>${title}</h2><p>${sub}</p></div><button class="icon-btn close" data-act="hide" aria-label="Recolher painel">${ICON.min}</button></header>`;

  if (rm && rm.kind === "voice") {
    const ppl = visibleNpcs().filter((n) => n.room && n.room.id === rm.id);
    let body = "";

    else if (vs.status === "error") body = `<div class="card"><div class="grow"><strong style="color:var(--danger-text)">Não foi possível conectar à voz</strong><small>O servidor de voz não respondeu. Você continua na sala e pode usar o chat de texto do canal.</small></div></div><button class="btn primary" data-act="retry">Tentar de novo</button>`;
    const list = [vs.status === "connected" ? me : null, ...ppl].filter(Boolean);
    body += `<ul class="plist">` + list.map((p) => `<li class="${state.speaking.has(p.id) ? "speaking" : ""}">${av(p.id, p.name)}<span>${esc(p.you ? "Você" : p.name)}</span><span class="where">${state.speaking.has(p.id) ? '<span class="bars"><i></i><i></i><i></i></span>' : p.you && !state.mic ? "mudo" : ""}</span></li>`).join("") + `</ul>`;
    if (!ppl.length && vs.status === "connected") body += `<p class="sys">Só você aqui. Quem entrar na sala ${esc(rm.name)} cai direto no canal.</p>`;
    const sharer = ppl.find((p) => p.screen);
    if (sharer && vs.status === "connected") body += `<div class="card">${ICON.screen.replace("<svg", '<svg width="20" height="20" style="color:var(--work)"')}<div class="grow"><strong>${sharer.name} está compartilhando a tela</strong><small>Liberado para quem está na sala</small></div><button class="btn work" data-act="screen" data-who="${sharer.id}">Ver</button></div>`;
    if (state.cam && vs.status === "connected") body += `<div class="cam-tile" style="background:linear-gradient(135deg,#e3b341,#7a5a1c)">M<span>Você · câmera simulada</span></div>`;
    panel.innerHTML = head(`🔊 ${rm.name}`, `Canal de voz de ${REALMS[rm.realm].name} · entrar na sala é entrar no canal`) + `<div class="body">${body}</div>`;
    return;
  }

  if (state.near.length) {
    const ppl = state.near.map((id) => BY_ID[id]);
    const key = threadKey();
    const msgs = state.threads[key] || [];
    const chips = ppl.map((p) => `<span class="chip">${av(p.id, p.name)}${esc(p.name)}</span>`).join("");
    if (state.myStatus === "focus" && !state.threads["_open_" + key]) {
      panel.innerHTML = head("Por perto", "Você está em modo Foco: conversas não abrem sozinhas.") +
        `<div class="body"><div class="people">${chips}</div><button class="btn primary" data-act="open-thread">Abrir conversa</button></div>`;
      return;
    }
    const screens = ppl.map((p) => p.screen ? `<button class="btn" data-act="screen" data-who="${p.id}">Ver tela de ${esc(p.name)}</button>` : `<span class="note">${esc(p.name)} não compartilha a tela.</span>`).join("");
    panel.innerHTML = head("Conversa por perto", "Fica aberta enquanto vocês estiverem perto") +
      `<div class="body"><div class="people">${chips}</div>
        <div class="msgs">${msgs.length ? msgs.map((m) => `<div class="msg"><div class="meta-line"><strong style="color:${m.from === "Murilo" ? "var(--gold)" : "var(--text)"}">${esc(m.from === "Murilo" ? "Você" : m.from)}</strong><time>${m.t}</time></div><p>${esc(m.text)}</p></div>`).join("") : `<p class="sys">Vocês estão perto. Diga oi.</p>`}</div>
        <div>${screens}</div></div>
      <form class="composer" id="prox-form"><label class="sr-only" for="prox-input">Mensagem</label><input id="prox-input" autocomplete="off" maxlength="500" placeholder="Mensagem para ${esc(ppl.map((p) => p.name).join(", "))}"><p class="note">Texto agora. Voz por proximidade entra com o módulo de voz.</p></form>`;
    const body = panel.querySelector(".body"); body.scrollTop = body.scrollHeight;
    return;
  }

  // ninguém por perto
  panel.classList.add("compact");
  const npcs = visibleNpcs();
  if (!npcs.length) {
    panel.innerHTML = head("Ninguém por perto", "Só você no mapa por enquanto") +
      `<div class="body"><p class="sys" style="text-align:left">Quando alguém de Midgard HQ ou Valhalla abrir o Metaverso, aparece aqui e no mapa. Você pode marcar algo na lousa de eventos enquanto isso.</p><button class="btn" data-act="go-lousa">Ir até a lousa</button></div>`;
    return;
  }

    `<div class="body"><h3 style="margin:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)">No mapa agora · ${npcs.length}</h3>
    <ul class="plist">${npcs.map((n) => `<li style="padding:0"><button class="row" data-act="goto" data-who="${n.id}">${av(n.id, n.name)}<span>${esc(n.name)}</span><span class="where">${locName(n)}</span></button></li>`).join("")}</ul></div>`;
}
panel.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "hide") { state.panelHidden = true; renderPanel(); }
  if (act === "retry") { if (state.sim === "offline") { toast("A voz continua indisponível neste estado do mockup. Troque para Normal."); } connectVoice(state.room); renderLoc(); renderPanel(); }
  if (act === "screen") openModal("screen", b.dataset.who);
  if (act === "goto") { const n = BY_ID[b.dataset.who]; if (n.room && n.room.kind === "voice") walkToTile(n.room.entry[0], n.room.entry[1]); else walkToTile(n.x / T + 1, n.y / T); }
  if (act === "open-thread") { state.threads["_open_" + threadKey()] = true; renderPanel(); }
  if (act === "go-lousa") walkToTile(25, 14);
});
panel.addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("#prox-input"); const text = input.value.trim(); if (!text) return;
  const key = threadKey(); (state.threads[key] ||= []).push({ from: "Murilo", t: nowHM(), text });
  renderPanel(); $("#prox-input")?.focus();
  const who = state.near[0];
  setTimeout(() => {
    if (threadKey() !== key) return;
    const list = REPLIES[who] || ["Oi!", "Haha, verdade.", "Já volto."];
    replyIdx[who] = ((replyIdx[who] ?? -1) + 1) % list.length;
    state.threads[key].push({ from: BY_ID[who].name, t: nowHM(), text: list[replyIdx[who]] });
    const draft = $("#prox-input")?.value || ""; const focused = document.activeElement && document.activeElement.id === "prox-input";
    renderPanel(); const inp = $("#prox-input"); if (inp) { inp.value = draft; if (focused) inp.focus(); }
  }, 1300);
});
$("#reopen").addEventListener("click", () => { state.panelHidden = false; renderPanel(); });

/* ---------- Interações e modais ---------- */
function doInteract(it) {
  if (it.id === "lousa") openModal("events");
  else if (it.id === "quiz") openModal("quiz");
  else if (it.id === "desk") openModal("desk");
  else if (it.id === "cafe") toast("☕ Café na mão. Volte para a mesa quando quiser.");
  else if (it.id === "arcade") toast("Corrida de Sleipnir chega numa próxima sessão. Por enquanto, o Quiz está aberto na mesa de jogos.");
}
const back = $("#modal-back");
let lastFocus = null;
function openModal(kind, arg) {
  lastFocus = document.activeElement;
  back.hidden = false; keys.clear(); path = null;
  const close = `<button class="icon-btn" data-close aria-label="Fechar">${ICON.close}</button>`;
  let html = "";
  if (kind === "events") {
    const tagOf = (w) => { const rm = ROOM[w]; if (!rm) return ["Mesa de jogos", "gaming"]; if (rm.kind === "voice") return ["🔊 " + rm.name, rm.realm === "midgard" ? "work" : "gaming"]; if (rm.kind === "pause") return ["☕ " + rm.name, "pause"]; return [rm.name, "gaming"]; };
    html = `<div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="m-title"><header><div class="grow"><h2 id="m-title">📌 Lousa de eventos</h2><p>Eventos marcados aqui aparecem para todo mundo no mapa. Clicar no local leva você até a sala.</p></div>${close}</header>
      <ul class="events">${state.events.map((ev) => { const [tg, cls] = tagOf(ev.where); return `<li><span class="when">${esc(ev.when).replace("\n", "<br>")}</span><div><strong>${esc(ev.title)}</strong></div><button class="tag ${cls}" style="border:none" data-goto="${ev.where}">${tg}</button></li>`; }).join("")}</ul>
      <form class="add" id="ev-form"><label>Evento<input id="ev-title" required maxlength="60" placeholder="Ex.: Retro da sprint"></label><label>Quando<input id="ev-when" required maxlength="20" placeholder="Qui 08/10 14:00"></label><label>Onde<select id="ev-where"><option value="reuniao">🔊 Reunião</option><option value="squad1">🔊 Squad 1</option><option value="squad2">🔊 Squad 2</option><option value="copa">☕ Copa</option><option value="arena">Mesa de jogos</option></select></label><button class="btn primary" type="submit">Marcar</button></form></div>`;
  } else if (kind === "quiz") {
    const q = state.quiz;
    const sc = Object.entries(q.score).map(([n, v]) => `<span>${n === "Murilo" ? "Você" : n}: <b style="color:var(--text)">${v}</b></span>`).join(" · ");
    const opts = ["Heimdall", "Loki", "Baldur"].map((o) => `<button type="button" data-answer="${o}" class="${q.answered ? (o === "Heimdall" ? "right" : o === q.answered ? "wrong" : "") : ""}" ${q.answered ? "disabled" : ""}>${o}</button>`).join("");
    html = `<div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="m-title"><header><div class="grow"><h2 id="m-title">Quiz de Asgard</h2><p>Sessão aberta na mesa de jogos · Baldur e Idunn estão jogando</p></div>${close}</header>
      ${q.joined ? `<div class="score">Pergunta 3 de 10 · ${sc}</div><div class="quiz-q">Quem guarda a Bifröst?</div><div class="quiz-opts">${opts}</div>${q.answered ? `<p class="sys" style="text-align:left">${q.answered === "Heimdall" ? "Acertou, +10. A próxima pergunta começa quando todos responderem." : "Era Heimdall. A próxima pergunta começa quando todos responderem."}</p>` : ""}`
        : `<div class="card"><div class="grow"><strong>Sessão em andamento</strong><small>Rodadas de 10 perguntas. Quem entrar agora começa com 0 pontos.</small></div></div><button class="btn primary" data-join>Entrar na sessão</button>`}</div>`;
  } else if (kind === "screen") {
    const p = BY_ID[arg];
    html = `<div class="modal wide glass" role="dialog" aria-modal="true" aria-labelledby="m-title"><header><div class="grow"><h2 id="m-title">Tela de ${esc(p.name)}</h2><p>Compartilhamento liberado por ${esc(p.name)}. Conteúdo fictício do mockup.</p></div>${close}</header>
      <div class="shared"><div class="bar"><i></i><i></i><i></i><span>Sprint 42 · Midgard HQ</span></div>
      <div class="kanban"><div><h4>A fazer</h4><div class="k">Login com Discord</div><div class="k g">Canais de voz (WebRTC)</div></div>
      <div><h4>Fazendo</h4><div class="k y">Metaverso: protótipo do mapa</div><div class="k">Lousa de eventos</div></div>
      <div><h4>Feito</h4><div class="k">Realms e canais de texto</div><div class="k">Servidor Axum + WebSocket</div></div></div></div></div>`;
  } else if (kind === "desk") {
    const opt = (v, t, s) => `<label><input type="radio" name="st" value="${v}" ${state.myStatus === v ? "checked" : ""}><span><strong>${t}</strong><small>${s}</small></span></label>`;
    html = `<div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="m-title"><header><div class="grow"><h2 id="m-title">Sua mesa</h2><p>Seu ponto fixo quando você não está em nenhum canal de voz. Quem chegar perto abre conversa com você: texto agora, voz depois.</p></div>${close}</header>
      <div class="radio-list" role="radiogroup" aria-label="Status">${opt("online", "Disponível", "Conversa por proximidade abre sozinha")}${opt("focus", "Foco", "Quem chegar perto vê você, mas a conversa só abre se você aceitar")}${opt("away", "Ausente", "Seu avatar fica na mesa com status cinza")}</div>
      <label class="toggle-row"><span class="grow"><strong>Permitir que vejam minha tela</strong><small>Quem estiver perto ou na mesma sala pode abrir sua tela quando você compartilhar</small></span><input type="checkbox" id="allow-screen" ${state.allowScreen ? "checked" : ""}></label></div>`;
  }

  first && first.focus();

function closeModal() { back.hidden = true; back.innerHTML = ""; (lastFocus && lastFocus.focus) ? lastFocus.focus() : cv.focus(); }
back.addEventListener("click", (e) => {
  if (e.target === back || e.target.closest("[data-close]")) { closeModal(); return; }
  const g = e.target.closest("[data-goto]");
  if (g) { const w = g.dataset.goto; closeModal(); if (ROOM[w] && ROOM[w].entry) walkToTile(ROOM[w].entry[0], ROOM[w].entry[1]); else walkToTile(44, 27); return; }

});
back.addEventListener("change", (e) => {
  if (e.target.name === "st") { state.myStatus = e.target.value; renderSidebar(); renderPanel(); }
  if (e.target.id === "allow-screen") { state.allowScreen = e.target.checked; }

back.addEventListener("submit", (e) => {
  e.preventDefault();

  state.events.push({ when: $("#ev-when").value.trim(), title: $("#ev-title").value.trim(), where: $("#ev-where").value });
  openModal("events"); toast("Evento marcado na lousa.");
});

  drawStatic();
}
$("#dir-seg").addEventListener("click", (e) => { const b = e.target.closest("[data-dir]"); if (b) setDir(b.dataset.dir); });
$("#sim-state").addEventListener("change", (e) => {
  state.sim = e.target.value;
  if (state.room && state.room.kind === "voice") connectVoice(state.room);
  state.near = []; updateSub(); renderSidebar(); renderPanel(); renderLoc();
  toast({ normal: "Estado normal.", offline: "Simulando servidor de voz fora do ar. Entre numa sala para ver.", alone: "Simulando mapa vazio: só você online." }[state.sim]);
});

/* ---------- Gaveta (telas estreitas) ---------- */
function closeDrawer() { $("#app").classList.remove("drawer-open"); $("#menu-btn").setAttribute("aria-expanded", "false"); }
$("#menu-btn").addEventListener("click", () => { const open = $("#app").classList.toggle("drawer-open"); $("#menu-btn").setAttribute("aria-expanded", String(open)); });
stage.addEventListener("pointerdown", () => closeDrawer());

/* ---------- Toast e dica ---------- */
let toastT = null;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 3200); }
function dismissHint() { if (state.hintSeen) return; state.hintSeen = true; $("#hint").hidden = true; }
$("#hint-close").addEventListener("click", dismissHint);

/* ---------- Início ---------- */
// Âncoras simples: #reuniao, #squad1, #copa, #cozy, #noite
const HASH = (location.hash || "").slice(1);
if (THEMES[HASH]) themeId = HASH;
if (ROOM[HASH] && ROOM[HASH].entry) { const p = tc(ROOM[HASH].entry[0], ROOM[HASH].entry[1] - 1); me.x = p.x; me.y = p.y; me.dir = "up"; state.hintSeen = true; $("#hint").hidden = true; }
setDir(themeId);
renderRealms(); renderControls(); renderLoc(); renderPanel(); updateSub();
new ResizeObserver(resize).observe(stage);
resize();
if (!ROOM[HASH]) { state.room = roomAt(me.x, me.y - 2); renderLoc(); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
let last = performance.now();
function loop(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; if (state.view === "meta") { update(dt); render(t); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
</script>
</body></html>
